set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

unbind C-b
set -g prefix C-space
bind C-space send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Navigation
bind-key j swap-pane -U
bind-key k swap-pane -D
bind-key K swap-window -d -t -1
bind-key J swap-window -d -t +1
bind -n C-Tab next-window
bind -n C-BTab  previous-window
bind -n M-w choose-window

# Resize pane
bind -n M-Left  resize-pane -L 1
bind -n M-Right resize-pane -R 1
bind -n M-Up    resize-pane -U 1
bind -n M-Down  resize-pane -D 1

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'niksingh710/minimal-tmux-status'

# set vi-mode
set-window-option -g mode-keys vi

# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind-key b set-option status
bind-key o new-session

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Colours
set -g pane-border-style fg="#3c3836"
set -g pane-active-border-style "bg=default fg=#a89984"
set -g @minimal-tmux-bg "#a89984"

# Sesh
set -g detach-on-destroy off  # don't exit from tmux when closing a session
bind -N "last-session (via sesh) " L run-shell "sesh last"

run '~/.local/share/tmux/plugins/tpm/tpm'
